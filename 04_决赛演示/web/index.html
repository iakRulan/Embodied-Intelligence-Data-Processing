<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RefSync-QA 演示</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="wordmark">RefSync<span class="wm-sep">-</span>QA</span>
    <span class="brand-sub">具身智能多模态数据质量检测与安全治理</span>
  </div>
  <nav class="steps" id="steps" aria-label="演示步骤">
    <button data-step="1"><b>1</b>检测</button>
    <button data-step="2"><b>2</b>修复</button>
    <button data-step="3"><b>3</b>对比</button>
  </nav>
  <div class="top-right">
    <div class="seg" id="modeSeg" role="radiogroup" aria-label="运行方式">
      <button data-mode="live" class="on" role="radio" aria-checked="true">实时运行</button>
      <button data-mode="replay" role="radio" aria-checked="false">回放</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换明暗（T）" aria-label="切换明暗">◐</button>
  </div>
</header>

<main id="app">
  <!-- 1 检测 -->
  <section class="view" data-view="1">
    <div class="run-shell" data-stage="detect"></div>
  </section>
  <section class="view" data-view="2">
    <div class="run-shell" data-stage="govern"></div>
  </section>

  <!-- 3 对比 -->
  <section class="view" data-view="3">
    <div class="cmp-grid">
      <aside class="cmp-list panel" id="cmpList"></aside>
      <div class="cmp-main" id="cmpMain"></div>
    </div>
  </section>
</main>

<!-- 单条轨迹抽屉 -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-body" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <button class="icon-btn drawer-x" data-close aria-label="关闭">✕</button>
    <div id="drawerContent"></div>
  </div>
</div>

<!-- 文件预览 / 明细 -->
<div class="modal" id="modal" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="modal-body" role="dialog" aria-modal="true">
    <button class="icon-btn drawer-x" data-close aria-label="关闭">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="tooltip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<template id="runTpl">
  <div class="run-head">
    <div class="run-title">
      <h2 class="rt-name"></h2>
      <p class="rt-desc"></p>
    </div>
    <div class="run-actions">
      <button class="cta run-btn"></button>
      <code class="cli" title="等价命令行"></code>
    </div>
  </div>
  <div class="run-body">
    <div class="meter panel">
      <div class="clock"><span class="clock-v">0.00</span><span class="clock-u">秒</span></div>
      <div class="clock-sub">算子计时</div>
      <div class="prog"><div class="prog-bar"><i></i></div><div class="prog-t"><b class="pk">0</b> / <span class="pn">89</span> 条轨迹</div></div>
      <dl class="counters">
        <div><dt>已读数据行</dt><dd class="c-rows">0</dd></div>
        <div><dt>已解码图像</dt><dd class="c-img">0</dd></div>
        <div><dt>图像吞吐</dt><dd class="c-ips">—</dd></div>
        <div><dt>并行进程</dt><dd class="c-w">—</dd></div>
      </dl>
      <ol class="phases"></ol>
      <div class="console" aria-live="polite"></div>
    </div>
    <div class="board panel">
      <div class="board-head">
        <h3>89 条轨迹处理状态</h3>
        <div class="legend tiles-legend"></div>
      </div>
      <div class="tiles"></div>
      <div class="live">
        <div class="live-status"></div>
        <div class="live-cats"></div>
      </div>
    </div>
  </div>
  <div class="result" hidden></div>
</template>

<script src="app.js"></script>
</body>
</html>
