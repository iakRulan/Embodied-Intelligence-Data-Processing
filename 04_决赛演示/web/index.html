<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RefSync-QA 演示</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="wordmark">RefSync<span class="wm-sep">-</span>QA</span>
    <span class="brand-sub">具身智能多模态数据质量检测与安全治理</span>
  </div>
  <nav class="steps" id="steps" aria-label="演示步骤">
    <button data-step="1"><b>1</b>导入数据</button>
    <button data-step="2"><b>2</b>检测</button>
    <button data-step="3"><b>3</b>修复</button>
    <button data-step="4"><b>4</b>对比</button>
  </nav>
  <div class="top-right">
    <div class="cur" id="curChip" hidden></div>
    <button class="icon-btn" id="themeBtn" title="切换明暗（T）" aria-label="切换明暗">◐</button>
  </div>
</header>

<main id="app">
  <!-- 1 导入数据：示例数据 / 我的数据 / 历史结果，选好后一键开始检测 -->
  <section class="view" data-view="1">
    <div class="data-grid">
      <section class="panel card ex" id="exCard">
        <div class="ex-head">
          <div><span class="kicker">示例数据</span><h2 id="exTitle">赛题公开测试集</h2><p class="ex-figs" id="exFigs"></p></div>
          <button class="src-all" id="exAll"></button>
        </div>
        <div class="ex-pick-h"><span>或指定一条</span><span class="ex-legend" id="exLegend"></span></div>
        <div class="ex-grid" id="exGrid"></div>
      </section>
      <aside class="data-side">
        <section class="panel card">
          <span class="kicker">我的数据</span>
          <div class="imp-btns">
            <button class="ghost" id="impPickDir">选择文件夹</button>
            <button class="ghost" id="impPickFile">选择文件</button>
          </div>
          <div class="drop" id="impDrop" tabindex="0">拖入 .parquet 文件或文件夹</div>
          <div class="imp-path"><input id="impPath" type="text" placeholder="或粘贴路径，回车" spellcheck="false" aria-label="数据路径"></div>
          <input type="file" id="impFileInput" accept=".parquet" hidden>
          <input type="file" id="impDirInput" webkitdirectory multiple hidden>
          <div id="impMsg" class="imp-msg"></div>
        </section>
        <section class="panel card">
          <span class="kicker">历史结果</span>
          <div id="histList" class="hist-list"></div>
        </section>
      </aside>
    </div>
    <div class="selbar panel" id="selBar" hidden>
      <div class="sel-info" id="selInfo"></div>
      <button class="cta" id="selGo">开始检测 →</button>
    </div>
  </section>

  <!-- 2 检测 / 3 修复（共用运行面板） -->
  <section class="view" data-view="2"><div class="run-shell" data-stage="detect"></div></section>
  <section class="view" data-view="3"><div class="run-shell" data-stage="govern"></div></section>

  <!-- 4 对比 -->
  <section class="view" data-view="4">
    <div class="cmp-grid">
      <aside class="cmp-list panel" id="cmpList"></aside>
      <div class="cmp-main" id="cmpMain"></div>
    </div>
  </section>
</main>

<!-- 单条轨迹抽屉 -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-body" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <button class="icon-btn drawer-x" data-close aria-label="关闭">✕</button>
    <div id="drawerContent"></div>
  </div>
</div>

<!-- 明细 / 预览 -->
<div class="modal" id="modal" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="modal-body" role="dialog" aria-modal="true">
    <button class="icon-btn drawer-x" data-close aria-label="关闭">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="tooltip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<template id="runTpl">
  <div class="run-head">
    <div class="run-title"><h2 class="rt-name"></h2><span class="rt-data"></span></div>
    <div class="run-actions"><button class="cta run-btn"></button></div>
  </div>
  <div class="run-empty panel empty" hidden><h3>先选择要处理的数据</h3><button class="cta" data-goto="1">去导入数据</button></div>
  <div class="run-body">
    <div class="meter panel">
      <div class="clock" title=""><span class="clock-v">0.00</span><span class="clock-u">秒</span></div>
      <div class="clock-sub">算子计时</div>
      <div class="prog"><div class="prog-bar"><i></i></div><div class="prog-t"><b class="pk">0</b> / <span class="pn">0</span> 条</div></div>
      <dl class="counters">
        <div><dt>已读数据行</dt><dd class="c-rows">0</dd></div>
        <div><dt>已解码图像</dt><dd class="c-img">0</dd></div>
        <div><dt>图像吞吐</dt><dd class="c-ips">—</dd></div>
        <div><dt>并行进程</dt><dd class="c-w">—</dd></div>
      </dl>
      <ol class="phases"></ol>
      <div class="live-cats"></div>
    </div>
    <div class="board panel">
      <div class="board-head">
        <h3 class="bh-title">逐帧检测全景</h3>
        <div class="legend live-legend"></div>
      </div>
      <div class="live-caption" aria-live="polite">
        <span class="lc-k">实时</span>
        <div class="lc-body"><b class="lc-text">等待开始</b><span class="lc-meta"></span></div>
      </div>
      <div class="live-status"></div>
      <div class="live-grid">
        <div class="live-pano">
          <div class="pano-wrap"><canvas data-live></canvas></div>
          <div class="lp-axis"><span>每行一条 · 每格一帧</span><span class="lp-n"></span></div>
        </div>
        <div class="feed-col">
          <div class="mini-h feed-h">逐条发现</div>
          <ol class="feed" aria-live="polite"></ol>
        </div>
      </div>
    </div>
  </div>
  <div class="result" hidden></div>
</template>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
