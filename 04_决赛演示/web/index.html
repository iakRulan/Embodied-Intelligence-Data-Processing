<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RefSync-QA 演示</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="wordmark">RefSync<span class="wm-sep">-</span>QA</span>
    <span class="brand-sub">具身智能多模态数据质量检测与安全治理</span>
  </div>
  <nav class="steps" id="steps" aria-label="演示步骤">
    <button data-step="1"><b>1</b>数据与成绩</button>
    <button data-step="2"><b>2</b>质量检测</button>
    <button data-step="3"><b>3</b>安全治理</button>
    <button data-step="4"><b>4</b>修复前后</button>
    <button data-step="5"><b>5</b>导入测试</button>
  </nav>
  <div class="top-right">
    <div class="seg" id="modeSeg" role="radiogroup" aria-label="运行方式">
      <button data-mode="live" class="on" role="radio" aria-checked="true">实时运行</button>
      <button data-mode="replay" role="radio" aria-checked="false">回放</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换明暗（T）" aria-label="切换明暗">◐</button>
  </div>
</header>

<main id="app">
  <!-- 1 数据与成绩 -->
  <section class="view" data-view="1">
    <div class="ov-grid">
      <div class="ov-main">
        <figure class="hero" id="hero">
          <div class="hero-frames">
            <div class="hf"><img alt="场景相机画面" data-cam="image"><span>场景相机</span></div>
            <div class="hf"><img alt="左腕相机画面" data-cam="left_wrist_image"><span>左腕相机</span></div>
            <div class="hf"><img alt="右腕相机画面" data-cam="right_wrist_image"><span>右腕相机</span></div>
          </div>
          <figcaption id="heroCap"></figcaption>
        </figure>
        <div class="ds">
          <h1 id="dsTitle">赛题公开测试集</h1>
          <div class="ds-figs" id="dsFigs"></div>
          <p class="ds-spec" id="dsSpec"></p>
          <ol class="flow" id="flow"></ol>
          <div class="cta-row">
            <button class="cta" id="goDetect">开始质量检测</button>
            <span class="hint">检测阶段只读，不改写任何原始数据</span>
          </div>
        </div>
      </div>
      <aside class="ov-side panel" id="official"></aside>
    </div>
  </section>

  <!-- 2 质量检测 / 3 安全治理（共用运行面板） -->
  <section class="view" data-view="2">
    <div class="run-shell" data-stage="detect"></div>
  </section>
  <section class="view" data-view="3">
    <div class="run-shell" data-stage="govern"></div>
  </section>

  <!-- 4 修复前后 -->
  <section class="view" data-view="4">
    <div class="cmp-grid">
      <aside class="cmp-list panel" id="cmpList"></aside>
      <div class="cmp-main" id="cmpMain"></div>
    </div>
  </section>
  <!-- 5 导入测试 -->
  <section class="view" data-view="5">
    <div class="run-head"><div class="run-title"><h2>导入测试</h2>
      <p>现场导入任意 LeRobot 数据：单个 Parquet 文件逐条测试，或选一个文件夹批量测试。原始数据只读，每次测试的结果单独保存，可随时回看。</p></div></div>
    <div class="imp-grid">
      <aside class="imp-side">
        <div class="panel card">
          <div class="step-h"><b>1</b>选择数据</div>
          <div class="imp-btns">
            <button class="ghost" id="impPickFile">选择单个文件</button>
            <button class="ghost" id="impPickDir">选择文件夹</button>
          </div>
          <div class="drop" id="impDrop" tabindex="0"><span>把 .parquet 文件或数据集文件夹拖到这里</span><small>拖入的文件会先复制到本次测试目录</small></div>
          <div class="imp-path"><input id="impPath" type="text" placeholder="或粘贴路径后回车" spellcheck="false" aria-label="数据路径"><button class="ghost sm" id="impCheck">读取</button></div>
          <input type="file" id="impFileInput" accept=".parquet" hidden>
          <input type="file" id="impDirInput" webkitdirectory multiple hidden>
          <div id="impSel" class="imp-sel"></div>
        </div>
        <div class="panel card">
          <div class="step-h"><b>2</b>处理方式</div>
          <div class="seg imp-mode" id="impMode" role="radiogroup"><button data-m="govern" class="on">检测 + 修复</button><button data-m="detect">只检测</button></div>
          <button class="cta imp-run" id="impRun" disabled>开始测试</button>
        </div>
        <div class="panel card">
          <div class="step-h"><b>3</b>测试记录</div>
          <div id="impHist" class="imp-hist"></div>
        </div>
      </aside>
      <div class="imp-main">
        <div class="panel empty" id="impEmpty"><h3>先在左侧选择要测试的数据</h3><p>单个文件适合现场挑一条轨迹看细节；文件夹会把其中所有 Parquet 一次性批量检测。</p></div>
        <div class="run-shell" data-stage="import" hidden></div>
      </div>
    </div>
  </section>
</main>

<!-- 单条轨迹抽屉 -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-body" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <button class="icon-btn drawer-x" data-close aria-label="关闭">✕</button>
    <div id="drawerContent"></div>
  </div>
</div>

<!-- 文件预览 / 明细 -->
<div class="modal" id="modal" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="modal-body" role="dialog" aria-modal="true">
    <button class="icon-btn drawer-x" data-close aria-label="关闭">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="tooltip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<template id="runTpl">
  <div class="run-head">
    <div class="run-title">
      <h2 class="rt-name"></h2>
      <p class="rt-desc"></p>
    </div>
    <div class="run-actions">
      <button class="cta run-btn"></button>
      <code class="cli" title="等价命令行"></code>
    </div>
  </div>
  <div class="run-body">
    <div class="meter panel">
      <div class="clock"><span class="clock-v">0.00</span><span class="clock-u">秒</span></div>
      <div class="clock-sub">算子计时</div>
      <div class="prog"><div class="prog-bar"><i></i></div><div class="prog-t"><b class="pk">0</b> / <span class="pn">89</span> 条轨迹</div></div>
      <dl class="counters">
        <div><dt>已读数据行</dt><dd class="c-rows">0</dd></div>
        <div><dt>已解码图像</dt><dd class="c-img">0</dd></div>
        <div><dt>图像吞吐</dt><dd class="c-ips">—</dd></div>
        <div><dt>并行进程</dt><dd class="c-w">—</dd></div>
      </dl>
      <ol class="phases"></ol>
      <div class="console" aria-live="polite"></div>
    </div>
    <div class="board panel">
      <div class="board-head">
        <h3>89 条轨迹处理状态</h3>
        <div class="legend tiles-legend"></div>
      </div>
      <div class="tiles"></div>
      <div class="live">
        <div class="live-status"></div>
        <div class="live-cats"></div>
      </div>
    </div>
  </div>
  <div class="result" hidden></div>
</template>

<script src="app.js"></script>
</body>
</html>
